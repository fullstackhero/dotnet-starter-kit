name: CodeQL Analysis
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # NuGet audit is off for this build only. The weekly scan runs against an unchanged main, so a
      # newly published advisory fails restore under TreatWarningsAsErrors and the code scan never runs
      # (that is what broke it every week from 2026-10-19). Backend CI still gates advisories on every PR.
      - run: dotnet build src/FSH.Starter.slnx -c Release -p:NuGetAudit=false
      - uses: github/codeql-action/analyze@v4
